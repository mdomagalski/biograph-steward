<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in | BioGraph Steward</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:#172b3a;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{background:#102e42;color:white;padding:28px max(24px,calc((100vw - 960px)/2))}header p{margin:0;color:#acd9db;font-size:12px;letter-spacing:.12em}h1{font-size:28px;margin:6px 0}
main{max-width:500px;margin:48px auto;padding:0 20px}.card{padding:28px;background:white;border:1px solid #d9e3e9;border-radius:12px}h2{margin:0;font-size:24px}p{color:#52697b}label{display:block;font-weight:600;margin-bottom:8px}input{width:100%;padding:12px;border:1px solid #adc0cf;border-radius:6px;font:inherit}input:focus{outline:2px solid #147c83;outline-offset:2px}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:6px;background:#147c83;color:white;font:600 16px system-ui;cursor:pointer}.small{font-size:13px}.error{color:#a53d40}
</style>
</head>
<body>
<header><p>BIOGRAPH STEWARD / EVIDENCE WORKBENCH</p><h1>Follow each claim to its evidence.</h1></header>
<main><section class="card"><h2>Sign in to your workspace</h2>
<p>Enter your workspace access token to open the evidence workbench.</p>
__ERROR__
<form method="post" action="/auth/login">
<input type="hidden" name="return_to" value="__RETURN_TO__">
<label for="token">Workspace access token</label>
<input id="token" name="token" type="password" maxlength="256" autocomplete="current-password" required autofocus>
<button type="submit">Sign in</button>
</form>
<p class="small">Your session lasts up to 8 hours. You may need to sign in again after the app restarts.</p>
</section></main>
</body>
</html>
