name: Portability

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
      no_proxy: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -q
      - name: Check wheel assets outside the source import path
        run: python -I -c "from biograph_steward.webapp import report_html; assert 'BioGraph' in report_html()"

  nvidia:
    runs-on: ubuntu-latest
    env:
      NO_PROXY: 127.0.0.1,localhost,::1
      no_proxy: 127.0.0.1,localhost,::1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[nvidia]'
      - run: python -m unittest discover -s tests -p test_nvidia_workflow.py -v

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag biograph-steward:test .
      - name: Check container startup, persistence and access protection
        shell: bash
        run: |
          set -euo pipefail
          docker volume create steward-test-data
          docker run -d --name steward-test -p 127.0.0.1:8766:8766 \
            -e BIOGRAPH_ACCESS_TOKEN=generated-ci-test-token-not-a-real-secret \
            -v steward-test-data:/data biograph-steward:test
          trap 'docker logs steward-test; docker rm -f steward-test; docker volume rm steward-test-data' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8766/healthz; then ready=true; break; fi
            sleep 2
          done
          test "$ready" = true
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8766/)" = 401
          curl --silent --fail -H 'Authorization: Bearer generated-ci-test-token-not-a-real-secret' \
            -H 'Content-Type: application/json' --data '{"mode":"demo"}' http://127.0.0.1:8766/api/build > /tmp/steward-ci-run.json
          steward_run_id=$(python3 -c 'import json; print(json.load(open("/tmp/steward-ci-run.json"))["run_id"])')
          docker restart steward-test
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:8766/healthz; then break; fi
            sleep 2
          done
          curl --silent --fail -H 'Authorization: Bearer generated-ci-test-token-not-a-real-secret' \
            "http://127.0.0.1:8766/api/run/$steward_run_id" | python3 -c 'import json,sys; assert json.load(sys.stdin)["graph"]["data_kind"] == "synthetic_demo"'
